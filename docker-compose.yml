services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wedding
      POSTGRES_PASSWORD: wedding
      POSTGRES_DB: wedding
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedding -d wedding"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Render workers (design §5): same image, two isolated services. Start with `pnpm workers:up`.
  render-preview:
    build: { context: ., dockerfile: Dockerfile.worker }
    profiles: [workers]
    environment: { RENDER_MODE: preview, WORKER_SECRET: dev-worker-secret, PORT: "4100" }
    ports: ["4101:4100"]
  render-export:
    build: { context: ., dockerfile: Dockerfile.worker }
    profiles: [workers]
    environment: { RENDER_MODE: export, WORKER_SECRET: dev-worker-secret, PORT: "4100" }
    ports: ["4102:4100"]

volumes:
  postgres-data:
